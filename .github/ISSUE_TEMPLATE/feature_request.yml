name: 功能建议
description: 建议新的清理规则、提示或交互改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 需要解决的问题
      description: 请描述使用场景，而不仅是期望的按钮名称。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: risk
    attributes:
      label: 数据用途和删除风险
      description: 如果是清理规则，请说明该数据由什么程序产生、删除后可能有什么影响。
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 我已经从描述、路径和截图中移除个人信息。
          required: true
