name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        shell: powershell
        run: .\tests\Smoke.Tests.ps1

      - name: Build portable app
        shell: powershell
        run: .\build-portable.ps1

      - name: Verify portable app
        shell: powershell
        run: '& ".\dist\C盘清理助手.exe" -SmokeTest'

      - name: Prepare release assets
        shell: powershell
        run: |
          Copy-Item -LiteralPath '.\dist\C盘清理助手.exe' -Destination '.\dist\WindowsCClear-Portable.exe'
          (Get-FileHash -Algorithm SHA256 -LiteralPath '.\dist\WindowsCClear-Portable.exe').Hash.ToLowerInvariant() + '  WindowsCClear-Portable.exe' |
            Set-Content -LiteralPath '.\dist\SHA256SUMS.txt' -Encoding ascii

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            '.\dist\WindowsCClear-Portable.exe#C盘清理助手（免安装）.exe' `
            '.\dist\SHA256SUMS.txt#SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --title "C盘清理助手 $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
