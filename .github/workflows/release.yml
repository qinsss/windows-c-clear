name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        shell: powershell
        run: .\tests\Smoke.Tests.ps1

      - name: Build portable app
        shell: powershell
        run: .\build-portable.ps1

      - name: Verify portable app
        shell: powershell
        run: |
          $app = Get-ChildItem -LiteralPath '.\dist' -Filter '*.exe' | Select-Object -First 1
          if (-not $app) { throw 'Portable executable was not generated.' }
          $process = Start-Process -FilePath $app.FullName -ArgumentList '-SmokeTest' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable smoke test failed: $($process.ExitCode)" }

      - name: Prepare release assets
        shell: powershell
        run: |
          $app = Get-ChildItem -LiteralPath '.\dist' -Filter '*.exe' | Select-Object -First 1
          if (-not $app) { throw 'Portable executable was not generated.' }
          Copy-Item -LiteralPath $app.FullName -Destination '.\dist\WindowsCClear-Portable.exe'
          (Get-FileHash -Algorithm SHA256 -LiteralPath '.\dist\WindowsCClear-Portable.exe').Hash.ToLowerInvariant() + '  WindowsCClear-Portable.exe' |
            Set-Content -LiteralPath '.\dist\SHA256SUMS.txt' -Encoding ascii

      - name: Create GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME `
            '.\dist\WindowsCClear-Portable.exe' `
            '.\dist\SHA256SUMS.txt' `
            --repo $env:GITHUB_REPOSITORY `
            --title "Windows C Clear $env:GITHUB_REF_NAME" `
            --generate-notes `
            --verify-tag
