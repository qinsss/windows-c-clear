name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run smoke tests
        shell: powershell
        run: .\tests\Smoke.Tests.ps1

      - name: Build portable app
        shell: powershell
        run: .\build-portable.ps1

      - name: Verify portable app
        shell: powershell
        run: |
          $app = Get-ChildItem -LiteralPath '.\dist' -Filter '*.exe' | Select-Object -First 1
          if (-not $app) { throw 'Portable executable was not generated.' }
          $process = Start-Process -FilePath $app.FullName -ArgumentList '-SmokeTest' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Portable smoke test failed: $($process.ExitCode)" }
